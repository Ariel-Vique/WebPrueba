<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Equipos Informáticos</title>
    <!-- Enlace a la hoja de estilos externa -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Encabezado con Flexbox -->
    <header>
        <img src="img/logo.svg" alt="Logo de equipos" width="40" height="40">
        <h1>Gestión de Equipos Informáticos</h1>
        <button id="btn-modo">🌙</button>
    </header>

    <!-- Contenido principal -->
    <main class="contenedor">
        
        <!-- Sección 1: Formulario para dar de alta equipos -->
        <section>
            <h2>Registrar Nuevo Equipo</h2>
            <form id="form-equipo">
                <label for="nombre">Nombre del Equipo</label>
                <input type="text" id="nombre" name="nombre" required maxlength="100" placeholder="Ej: Laptop ThinkPad T14">

                <label for="tipo">Tipo de Equipo</label>
                <select id="tipo" name="tipo" required>
                    <option value="">Seleccione un tipo...</option>
                    <option value="Laptop">Laptop</option>
                    <option value="Servidor">Servidor</option>
                    <option value="Periférico">Periférico</option>
                    <option value="Componente">Componente</option>
                </select>

                <label for="imagen">URL de la Imagen (Opcional)</label>
                <input type="url" id="imagen" name="imagen" placeholder="https://...">

                <label for="especificaciones">Especificaciones</label>
                <textarea id="especificaciones" name="especificaciones" maxlength="300" placeholder="Ej: 16GB RAM, SSD 512GB"></textarea>

                <button type="submit">Guardar Equipo</button>
                <p id="mensaje-error" class="error"></p>
            </form>
        </section>

        <!-- Sección 2: Listado de equipos -->
        <section>
            <h2>Inventario Actual</h2>
            <div class="buscador-contenedor">
                <input type="search" id="input-buscar" placeholder="Buscar por nombre o tipo...">
                <span id="contador">Equipos: 0</span>
            </div>

            <!-- Lista donde JavaScript inyectará las tarjetas -->
            <ul id="lista-equipos" class="grilla"></ul>
        </section>

    </main>

    <!-- Pie de página -->
    <footer>
        <p>Desarrollo Web - Examen Práctico</p>
    </footer>

    <!-- Script de JavaScript al final del body -->
    <script src="js/app.js"></script>
</body>
</html>
